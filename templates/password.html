<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>비밀번호 변경 · MEDPARK</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-brand"><strong>MEDPARK</strong><span>실적회의 통합관리</span></div>
    <h1>비밀번호 변경</h1>
    {% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}
    <form method="post" class="auth-form">
      <label>현재 비밀번호<input name="current_password" type="password"></label>
      <label>새 비밀번호<input name="new_password" type="password"></label>
      <label>새 비밀번호 확인<input name="confirm_password" type="password"></label>
      <button class="btn primary full" type="submit">변경</button>
      <a class="btn secondary full center" href="{{ url_for('report') }}">돌아가기</a>
    </form>
  </div>
</body></html>
